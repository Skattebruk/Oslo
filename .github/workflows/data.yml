name: Oppdater steder

# Henter barer, restauranter, parker osv. fra OpenStreetMap hver natt og
# committer endringer. Vercel publiserer automatisk når main endres.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/hent-data.mjs
      - name: Commit hvis endret
        run: |
          git add -N public/data/steder.json
          if git diff --quiet -- public/data/steder.json; then echo "Ingen endringer"; exit 0; fi
          git config user.name "oslo-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/steder.json
          git commit -m "Oppdater steder fra OpenStreetMap"
          git push
